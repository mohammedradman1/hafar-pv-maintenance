[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hafar-pv-maintenance"
version = "0.1.0"
description = "End-to-end solar panel segmentation and fault detection toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hafar PV Maintainers" }
]
keywords = ["solar", "segmentation", "fault detection", "pytorch", "streamlit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "albumentations>=1.4",
  "hydra-core>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "pydantic>=2.6",
  "pytorch-lightning>=2.2",
  "rich>=13.7",
  "scikit-learn>=1.4",
  "segmentation-models-pytorch>=0.3",
  "streamlit>=1.31",
  "torch>=2.2",
  "torchmetrics>=1.3",
  "torchvision>=0.17",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "black>=24.2",
  "isort>=5.13",
  "mypy>=1.9",
  "pre-commit>=3.6",
  "ruff>=0.3"
]
tests = [
  "pytest>=8.0",
  "pytest-cov>=4.1"
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5"
]
app = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hafar_pv*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "PL", "UP"]
ignore = ["E203"]
